<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Логическая схема в нотации Чеботко</title>
  <desc id="desc">Query-first логическая модель Cassandra: пользовательские запросы сопоставлены с таблицами чтения и ключами доступа.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .query { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .table { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; }
      .stat { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
      .h1 { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .h2 { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .t { font: 14px "Segoe UI", Arial, sans-serif; fill: #111827; }
      .small { font: 12px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .mono { font: 13px Consolas, "Courier New", monospace; fill: #0f172a; }
      .pk { fill: #047857; font-weight: 700; }
      .ck { fill: #7c3aed; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="980"/>
  <text x="40" y="50" class="h1">Логическая схема базы данных в нотации Чеботко</text>
  <text x="40" y="78" class="small">Слева показаны пользовательские сценарии чтения, справа - денормализованные таблицы Cassandra, спроектированные под эти запросы.</text>

  <rect class="panel" x="35" y="110" width="1430" height="820" rx="8"/>
  <text x="95" y="145" class="h2">Запросы приложения</text>
  <text x="760" y="145" class="h2">Логические таблицы чтения</text>

  <!-- Left query boxes -->
  <g id="queries">
    <rect class="query" x="70" y="175" width="430" height="54" rx="6"/>
    <text x="90" y="199" class="h2">Q0. Все последние вакансии</text>
    <text x="90" y="218" class="small">лента при пустых фильтрах</text>

    <rect class="query" x="70" y="245" width="430" height="54" rx="6"/>
    <text x="90" y="269" class="h2">Q1. Вакансии по профессии</text>
    <text x="90" y="288" class="small">profession = ?</text>

    <rect class="query" x="70" y="315" width="430" height="54" rx="6"/>
    <text x="90" y="339" class="h2">Q2. Вакансии по региону</text>
    <text x="90" y="358" class="small">country = ? AND region = ?</text>

    <rect class="query" x="70" y="385" width="430" height="54" rx="6"/>
    <text x="90" y="409" class="h2">Q3. Вакансии по удаленности</text>
    <text x="90" y="428" class="small">remote = ?</text>

    <rect class="query" x="70" y="455" width="430" height="54" rx="6"/>
    <text x="90" y="479" class="h2">Q4. Вакансии по типу занятости</text>
    <text x="90" y="498" class="small">employment_type = ?</text>

    <rect class="query" x="70" y="525" width="430" height="54" rx="6"/>
    <text x="90" y="549" class="h2">Q5. Вакансии по уровню опыта</text>
    <text x="90" y="568" class="small">experience_level = ?</text>

    <rect class="query" x="70" y="595" width="430" height="54" rx="6"/>
    <text x="90" y="619" class="h2">Q6. Вакансии по городу</text>
    <text x="90" y="638" class="small">country = ? AND city = ?</text>

    <rect class="query" x="70" y="665" width="430" height="54" rx="6"/>
    <text x="90" y="689" class="h2">Q7. Статистика региона</text>
    <text x="90" y="708" class="small">country = ? AND region = ?</text>

    <rect class="query" x="70" y="735" width="430" height="54" rx="6"/>
    <text x="90" y="759" class="h2">Q8. Вакансия по ID</text>
    <text x="90" y="778" class="small">vacancy_id = ?</text>

    <rect class="query" x="70" y="805" width="430" height="54" rx="6"/>
    <text x="90" y="829" class="h2">Q9. Работодатель по ID</text>
    <text x="90" y="848" class="small">employer_id = ?</text>

    <rect class="query" x="70" y="875" width="430" height="38" rx="6"/>
    <text x="90" y="899" class="h2">Q10. Вакансии работодателя</text>
  </g>

  <!-- Right logical tables -->
  <g id="tables">
    <rect class="table" x="730" y="172" width="630" height="58" rx="6"/>
    <text x="750" y="196" class="h2">vacancies_feed</text>
    <text x="750" y="216" class="mono"><tspan class="pk">PK feed_name</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="table" x="730" y="242" width="630" height="58" rx="6"/>
    <text x="750" y="266" class="h2">vacancies_by_profession</text>
    <text x="750" y="286" class="mono"><tspan class="pk">PK profession</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="table" x="730" y="312" width="630" height="58" rx="6"/>
    <text x="750" y="336" class="h2">vacancies_by_region</text>
    <text x="750" y="356" class="mono"><tspan class="pk">PK country, region</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="table" x="730" y="382" width="630" height="58" rx="6"/>
    <text x="750" y="406" class="h2">vacancies_by_remote</text>
    <text x="750" y="426" class="mono"><tspan class="pk">PK remote</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="table" x="730" y="452" width="630" height="58" rx="6"/>
    <text x="750" y="476" class="h2">vacancies_by_employment_type</text>
    <text x="750" y="496" class="mono"><tspan class="pk">PK employment_type</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="table" x="730" y="522" width="630" height="58" rx="6"/>
    <text x="750" y="546" class="h2">vacancies_by_experience_level</text>
    <text x="750" y="566" class="mono"><tspan class="pk">PK experience_level</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="table" x="730" y="592" width="630" height="58" rx="6"/>
    <text x="750" y="616" class="h2">vacancies_by_city</text>
    <text x="750" y="636" class="mono"><tspan class="pk">PK country, city</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></text>

    <rect class="stat" x="730" y="662" width="630" height="58" rx="6"/>
    <text x="750" y="686" class="h2">region_stats_by_key</text>
    <text x="750" y="706" class="mono"><tspan class="pk">PK country, region</tspan>, <tspan class="ck">CK posted_date</tspan></text>

    <rect class="table" x="730" y="732" width="630" height="58" rx="6"/>
    <text x="750" y="756" class="h2">vacancies_by_id</text>
    <text x="750" y="776" class="mono"><tspan class="pk">PK vacancy_id</tspan></text>

    <rect class="table" x="730" y="802" width="630" height="58" rx="6"/>
    <text x="750" y="826" class="h2">employers_by_id</text>
    <text x="750" y="846" class="mono"><tspan class="pk">PK employer_id</tspan></text>

    <rect class="table" x="730" y="872" width="630" height="42" rx="6"/>
    <text x="750" y="897" class="h2">vacancies_by_employer: <tspan class="mono"><tspan class="pk">PK employer_id</tspan>, <tspan class="ck">CK posted_date, posted_at, vacancy_id</tspan></tspan></text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M500 202 L730 202"/>
  <path class="arrow" d="M500 272 L730 272"/>
  <path class="arrow" d="M500 342 L730 342"/>
  <path class="arrow" d="M500 412 L730 412"/>
  <path class="arrow" d="M500 482 L730 482"/>
  <path class="arrow" d="M500 552 L730 552"/>
  <path class="arrow" d="M500 622 L730 622"/>
  <path class="arrow" d="M500 692 L730 692"/>
  <path class="arrow" d="M500 762 L730 762"/>
  <path class="arrow" d="M500 832 L730 832"/>
  <path class="arrow" d="M500 894 L730 894"/>

  <rect class="panel" x="585" y="160" width="95" height="742" rx="6"/>
  <text x="633" y="512" text-anchor="middle" class="small" transform="rotate(-90 633 512)">каждый запрос имеет отдельную таблицу чтения</text>
</svg>
